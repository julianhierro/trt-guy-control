<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRT Guy — Control Center</title>
<link rel="icon" href="https://assets.cdn.filesafe.space/WmcafLXT7njeQOu3fqlP/media/6a81c704cf50f900f223de18.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --panel:#0b0b0c; --panel-2:#0f0f11;
    --line:#1c1c1f; --line-bright:#2b2b30;
    --fg:#fff; --muted:#9b9ba3; --muted-2:#67676f;
    --accent:#1a5cff; --accent-2:#0f3fd6; --accent-soft:rgba(26,92,255,.14);
    --good:#22c55e; --mid:#eab308;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55;font-weight:400}
  ::selection{background:var(--accent);color:#fff}

  header.topbar{
    border-bottom:1px solid var(--line);padding:16px 30px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    position:sticky;top:0;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);z-index:5;
  }
  .brand{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:.12em;font-size:13.5px;
    display:flex;align-items:center;text-decoration:none;color:#fff}
  .brand .dot{width:7px;height:7px;background:var(--accent);border-radius:50%;margin-right:10px}
  .brand .slash{color:var(--muted-2);margin:0 5px}
  .topbar .right{display:flex;align-items:center;gap:12px;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.2em;color:var(--muted-2);text-transform:uppercase}
  .unlockbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid rgba(26,92,255,.35);
    background:var(--accent-soft);border-radius:12px;padding:14px 18px;margin-bottom:22px}
  .unlockbar p{margin:0;font-size:13.5px;color:#cfd8ff;flex:1 1 260px}
  .unlockbar input{flex:0 1 240px;background:#0a0a0c;border:1px solid var(--line-bright);border-radius:8px;
    color:#fff;padding:10px 12px;font:500 14px Inter,sans-serif;outline:0}
  .unlockbar input:focus{border-color:var(--accent)}
  .unlockbar button{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    padding:11px 15px;border-radius:8px;cursor:pointer;font-weight:700;border:1px solid var(--accent);
    background:var(--accent);color:#fff}

  main{padding:32px 30px 70px;max-width:1320px;margin:0 auto}

  .bar{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;flex-wrap:wrap;margin-bottom:20px}
  .bar h1{font-size:clamp(24px,2.8vw,34px);line-height:1.05;letter-spacing:-.03em;font-weight:800;margin:0}
  .bar .sub{font-size:13.5px;color:var(--muted-2);margin:8px 0 0}
  .range{display:flex;gap:5px}
  .range button{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    padding:9px 12px;background:transparent;color:var(--muted);border:1px solid var(--line-bright);
    border-radius:7px;cursor:pointer;font-weight:600;transition:all .14s}
  .range button:hover{color:#fff;border-color:#fff}
  .range button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .totals{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;
    background:var(--panel);overflow:hidden;margin-bottom:26px}
  .totals div{flex:1 1 150px;padding:16px 20px;border-right:1px solid var(--line)}
  .totals div:last-child{border-right:0}
  .totals .k{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;color:var(--muted-2);text-transform:uppercase}
  .totals .v{font-size:25px;font-weight:800;letter-spacing:-.03em;margin-top:6px;line-height:1}
  .totals .v.acc{color:var(--accent)}

  /* breadcrumb when you're inside a project */
  .crumb{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .crumb button{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    padding:9px 13px;background:transparent;color:var(--muted);border:1px solid var(--line-bright);
    border-radius:7px;cursor:pointer;font-weight:600}
  .crumb button:hover{color:#fff;border-color:#fff}
  .crumb .where{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted-2)}
  .crumb .where b{color:#fff}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .card{border:1px solid var(--line-bright);border-radius:14px;background:var(--panel);
    padding:22px;display:flex;flex-direction:column;transition:border-color .15s,transform .12s,box-shadow .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 14px 34px -14px rgba(26,92,255,.5)}
  .card.folder{cursor:pointer}
  .cardtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card .tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;color:var(--accent);
    text-transform:uppercase;font-weight:700}
  .card .count{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted-2)}
  .card .name{font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.25;margin:10px 0 6px;
    display:flex;align-items:center;gap:9px}
  .card .desc{font-size:13.5px;color:var(--muted);line-height:1.5;margin:0 0 18px;flex:1}

  .conv{display:flex;align-items:baseline;gap:10px;padding:14px 16px;border-radius:11px;
    background:var(--panel-2);border:1px solid var(--line);margin-bottom:12px}
  .conv .big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .conv .big.good{color:var(--good)} .conv .big.mid{color:var(--mid)}
  .conv .big.low{color:var(--muted)} .conv .big.acc{color:var(--accent)}
  .conv .lbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted-2)}
  .micro{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted-2);margin-bottom:16px}
  .micro b{color:#d8d8dd;font-weight:600;font-variant-numeric:tabular-nums}

  .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .tag-chip{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;
    padding:6px 9px;border-radius:6px;cursor:pointer;border:1px solid rgba(26,92,255,.3);
    background:var(--accent-soft);color:#a9c4ff;transition:all .14s;white-space:nowrap}
  .tag-chip:hover{border-color:var(--accent);color:#fff;background:rgba(26,92,255,.28)}
  .tag-chip.copied{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tag-none{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;
    color:var(--muted-2);padding:6px 0}
  .taghead{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--muted-2);margin-bottom:7px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    padding:11px 14px;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:8px;
    text-decoration:none;font-weight:700;cursor:pointer;transition:all .14s;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .btn.ghost{background:transparent;color:#fff;border-color:var(--line-bright)}
  .btn.ghost:hover{background:#fff;color:#000;border-color:#fff}
  .btn.copy.copied{background:var(--accent);color:#fff;border-color:var(--accent)}
  .dates{display:none;align-items:center;gap:6px;margin-left:6px}
  .dates.on{display:inline-flex}
  .dates input[type=date]{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;
    background:transparent;color:#fff;border:1px solid var(--line-bright);
    border-radius:6px;padding:6px 8px;color-scheme:dark;
  }
  .dates .to{font-size:10px;color:#8d97a5;letter-spacing:.14em}
  #resetBtn{border-color:rgba(234,88,12,.5);color:#ffb08a}
  #resetBtn:hover{background:#c2410c;border-color:#c2410c;color:#fff}
  .baseline{
    margin:10px 0 0;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:#ffb08a;display:none;
  }
  .baseline.on{display:block}
  .baseline button{
    margin-left:8px;background:transparent;border:1px solid var(--line-bright);color:#fff;
    border-radius:5px;padding:3px 8px;cursor:pointer;font:inherit;
  }

  /* editor overlay */
  .overlay{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column}
  .overlay.open{display:flex}
  .frame-bar{border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;
    justify-content:space-between;gap:14px;background:#0a0a0a;flex-shrink:0}
  .frame-bar .left{display:flex;align-items:center;gap:14px;min-width:0}
  .back{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:#fff;background:transparent;border:1px solid var(--line-bright);border-radius:7px;
    padding:8px 13px;cursor:pointer;font-weight:600}
  .back:hover{background:var(--accent);border-color:var(--accent)}
  .dev{display:flex;gap:5px;flex-shrink:0}
  .dev button{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    padding:8px 11px;background:transparent;color:var(--muted);border:1px solid var(--line-bright);
    border-radius:7px;cursor:pointer;font-weight:600;transition:all .14s}
  .dev button:hover{color:#fff;border-color:#fff}
  .dev button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .frame-bar .title{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#fff;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frame-bar .title .sub{color:var(--muted-2);font-weight:400;margin-left:9px;font-size:10.5px}
  .frame-bar .right a{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--line-bright);
    border-radius:7px;padding:8px 12px;font-weight:500}
  .frame-bar .right a:hover{color:#fff;border-color:#fff}
  .stage{flex:1;display:flex;justify-content:center;background:#0a0a0a;overflow:hidden}
  .stage.framed{padding:16px 0;background:#111}
  .stage iframe{flex:1;width:100%;border:0;background:#fff;transition:flex-basis .18s ease}
  .stage.framed iframe{flex:0 0 auto;border:1px solid var(--line-bright);border-radius:14px}

  @media(max-width:640px){
    main{padding:26px 18px 56px}
    .grid{grid-template-columns:1fr}
    header.topbar{padding:13px 18px}
    .topbar .right span{display:none}
    .dev,.frame-bar .title .sub{display:none}
    .totals div{flex:1 1 50%;border-bottom:1px solid var(--line)}
  }
</style>
</head>
<body>

<header class="topbar">
  <a href="#" class="brand"><span class="dot"></span>TRT<span class="slash">/</span>GUY</a>
  <div class="right">
    <span>Control Center</span>
  </div>
</header>

<main>
  <div class="bar">
    <div>
      <h1 id="title">Your projects</h1>
      <p class="sub" id="subtitle">Each funnel and its pages, with what they're converting at.</p>
    </div>
    <div class="range" id="range">
      <button data-days="7" class="on">7 days</button>
      <button data-days="30">30 days</button>
      <button data-days="90">90 days</button>
      <button data-days="0">All time</button>
      <button data-custom="1" id="customBtn">Custom&hellip;</button>
      <span class="dates" id="dates">
        <input type="date" id="dFrom"><span class="to">to</span><input type="date" id="dTo">
        <button id="applyDates" class="go">Apply</button>
      </span>
      <button id="resetBtn" title="Ignore everything before today, so your own test traffic stops counting">Reset stats</button>
      <button id="meBtn" title="Stop counting visits from this browser">Ignore me</button>
    </div>
  </div>

  <div class="baseline" id="baseline"></div>
  <div class="totals" id="totals"></div>
  <div id="crumbSlot"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay">
  <div class="frame-bar">
    <div class="left">
      <button type="button" class="back" id="backBtn">← Back</button>
      <div class="dev" id="dev">
        <button type="button" data-w="0" class="on">💻 Desktop</button>
        <button type="button" data-w="834">📲 Tablet</button>
        <button type="button" data-w="390">📱 Mobile</button>
      </div>
      <div class="title" id="frameTitle"></div>
    </div>
    <div class="right"><a href="#" target="_blank" rel="noopener" id="openTab">Open in new tab ↗</a></div>
  </div>
  <div class="stage" id="stage"><iframe id="frame" src="about:blank"></iframe></div>
</div>

<script>
  const CC = location.origin + location.pathname;

  /* ── Everything is grouped by PROJECT. One folder per funnel, its pages inside.
        kind:'gate'  = takes opt-ins, has a conversion rate
        kind:'asset' = sits behind an opt-in, so no conversion of its own
        key: the analytics page key the beacons write to
  ───────────────────────────────────────────────────────────────────────── */
  const PROJECTS = [
    {
      id:'coaching', icon:'📹', tag:'Offer', name:'Coaching',
      description:'Coaching is open at $125/week. VSL, who it is for, before/afters and the FAQ.',
      home:'https://julianhierro.github.io/trt-guy-coaching/',
      pages:[
        { kind:'gate',  key:'trtdad-coaching-gate', tags:["trt-dad", "coaching-interest"], name:'Sales Page',
          description:'The one coaching page: VSL, what\'s included, who it\'s for and who it isn\'t, 19 before/afters, $125/week and the FAQ. Start Now opens the email pop-up, then the order form.',
          url:'https://julianhierro.github.io/trt-guy-coaching/' },
        { kind:'gate', key:'trtdad-checkout', tags:["trt-dad", "coaching-client"], name:'Checkout',
          description:'Offer summary, price and guarantee, with your GoHighLevel Payment form in a pop-up. Conversion here = visitors who opened the payment form.',
          url:'https://julianhierro.github.io/trt-guy-coaching/pay.html' },
        { kind:'gate', key:'trtdad-checkout-paid', tags:[], name:'After payment',
          description:'Everyone who lands here has paid, so this card counts completed sales. Paste your intake-form URL into NEXT_STEP.url to make it forward automatically.',
          url:'https://julianhierro.github.io/trt-guy-coaching/thanks.html' },
        { kind:'gate', key:'trtdad-site', tags:["trt-dad", "coaching-interest"], name:'Coaching tab (main site)',
          description:'The coaching half of the two-tab main site. Cross-listed here because it is coaching — it lives in the Main Site project and shares that project\'s stats.',
          url:'https://julianhierro.github.io/trt-guy-site/', editHost:'https://julianhierro.github.io/trt-guy-site' }
      ]
    },
    {
      id:'quiz', group:'magnets', icon:'🩺', tag:'Lead Magnet', name:'Low-T Quiz',
      description:'The 10-question ADAM screen. Email captured before the result.',
      home:'https://julianhierro.github.io/trt-guy-quiz/',
      pages:[
        { kind:'gate', key:'trtdad-quiz', tags:["trt-dad", "adam-quiz", "low-t-positive / low-t-negative", "bloodwork-interested"], name:'Opt-In Page',
          description:'Questions, then the email gate.',
          url:'https://julianhierro.github.io/trt-guy-quiz/' },
        { kind:'thanks', key:'trtdad-quiz', tags:[], name:'Result Page (thank you)',
          description:'The result and the bloodwork panel show on the same page right after the gate — that screen is this funnel\'s thank-you step.',
          url:'https://julianhierro.github.io/trt-guy-quiz/' }
      ]
    },
    {
      id:'injection', group:'magnets', icon:'💉', tag:'Lead Magnet', name:'TRT Injection Guide',
      description:'Opt-in page, then the 17-page guide and the dose calculator.',
      home:'https://julianhierro.github.io/trt-guy-injection-guide/',
      pages:[
        { kind:'gate',  key:'trtdad-injection-gate', tags:["trt-dad", "injection-guide", "trt-interested"], name:'Opt-In Page',
          description:'Headline + email for the injection guide.',
          url:'https://julianhierro.github.io/trt-guy-injection-guide/' },
        { kind:'thanks', key:'trtdad-injection-thanks', tags:[], name:'Thank You Page',
          description:'Find the email, move it to the main inbox, hit reply. Links straight to the guide.',
          url:'https://julianhierro.github.io/trt-guy-injection-guide/thanks.html' },
        { kind:'asset', key:'trtdad-injection-guide', tags:["trt-dad", "injection-guide"], name:'Guide + Calculator',
          description:'PDF download, the full guide on the page, and the dose calculator.',
          pdf:'https://julianhierro.github.io/trt-guy-injection-guide/Hero-Dad-Complete-TRT-Injection-Guide.pdf',
          url:'https://julianhierro.github.io/trt-guy-injection-guide/guide.html' }
      ]
    },
    {
      id:'guide101', group:'magnets', icon:'📘', tag:'Lead Magnet', name:'The TRT 101 Guide',
      description:'Opt-in page, then the 17-page guide and the PDF download.',
      home:'https://julianhierro.github.io/trt-guy-101-guide/get',
      pages:[
        { kind:'gate',  key:'trtdad-101-gate', tags:["trt-dad", "trt-101-guide", "trt-interested"], name:'Opt-In Page',
          description:'First name + email. Tags trt-101-guide in GHL.',
          url:'https://julianhierro.github.io/trt-guy-101-guide/get' },
        { kind:'thanks', key:'trtdad-101-thanks', tags:[], name:'Thank You Page',
          description:'Find the email, move it to the main inbox, hit reply. Plus a direct PDF download.',
          url:'https://julianhierro.github.io/trt-guy-101-guide/thanks' },
        { kind:'asset', key:'trtdad-101-guide', tags:["trt-dad", "trt-101-guide"], name:'The TRT 101 Guide (PDF)',
          description:'The full 17-page guide. Edit it here, then download the PDF \u2014 \u2318K adds links.',
          pdf:'https://julianhierro.github.io/trt-guy-101-guide/TRT-Guy-TRT-101-Guide.pdf',
          url:'https://julianhierro.github.io/trt-guy-101-guide/' }
      ]
    },
    {
      id:'rules', group:'magnets', icon:'📋', tag:'Lead Magnet', name:'5 TRT Non-Negotiables',
      description:'Single opt-in page. The guide itself goes out by email.',
      home:'https://julianhierro.github.io/trt-guy-trt-rules/',
      pages:[
        { kind:'gate', key:'trtdad-rules-gate', tags:["trt-dad", "trt-non-negotiables", "trt-interested"], name:'Opt-In Page',
          description:'Your headline, your copy, and the form.',
          url:'https://julianhierro.github.io/trt-guy-trt-rules/' },
        { kind:'thanks', key:'trtdad-rules-thanks', tags:[], name:'Thank You Page',
          description:'Find the email, move it to the main inbox, hit reply.',
          url:'https://julianhierro.github.io/trt-guy-trt-rules/thanks.html' }
      ]
    },
    {
      id:'course', group:'magnets', icon:'✉️', tag:'Email Course', name:'30 Emails In 30 Days',
      description:'Opt-in page and the confirmation page for the free daily email course.',
      home:'https://julianhierro.github.io/trt-guy-30-days/',
      pages:[
        { kind:'gate', key:'trtdad-30days', tags:["trt-dad", "30-emails-30-days"], name:'Opt-In Page',
          description:'Copy kept word for word from the original GoHighLevel page.',
          url:'https://julianhierro.github.io/trt-guy-30-days/' },
        { kind:'thanks', key:'trtdad-30days-confirm', tags:[], name:'Thank You Page',
          description:'Find email #1, move it to the main inbox, hit reply — or the rest go to spam.',
          url:'https://julianhierro.github.io/trt-guy-30-days/confirmation.html' }
      ]
    },
    {
      id:'site', icon:'🏠', tag:'Hub', name:'Main Site',
      description:'Two sections toggled from the nav — the free email course and the coaching sales page. Also hosts /api/submit.',
      home:'https://julianhierro.github.io/trt-guy-site/',
      pages:[
        { kind:'gate', key:'trtdad-site', tags:["trt-dad", "30-emails-30-days", "coaching-interest"], name:'Home',
          description:'Email course + the full coaching sales page, switched from the nav bar. In ?edit=1 the tabs still work and the FAQ opens so you can edit it.',
          url:'https://julianhierro.github.io/trt-guy-site/' },
        { kind:'asset', key:'trtdad-30days-confirm', tags:[], name:'Email Confirmation Page',
          description:'Where the email-course opt-in lands — the whitelist steps. Same page as in the 30 Emails project.',
          url:'https://julianhierro.github.io/trt-guy-30-days/confirmation.html' }
      ]
    }
  ];

  /* ── Top level is a GROUP. "Lead Magnets" holds every magnet as its own
        subfolder; open one and you get its pages (opt-in, thank you, asset).
        A project with no group sits at the top level on its own. ── */
  const GROUPS = [
    { id:'magnets', icon:'🧲', tag:'Folder', name:'Lead Magnets',
      description:'Every free thing you give away. Each one opens into its own opt-in page and thank-you page.' }
  ];
  const groupOf = pr => pr.group ? GROUPS.find(g => g.id === pr.group) : null;

  // The link you'd actually send someone is the opt-in page — never the asset
  // sitting behind it. Derive it from the pages rather than a hand-set `home`,
  // so a project whose opt-in isn't at the root can't hand out the wrong URL.
  function entryUrl(pr){
    const gate = (pr.pages || []).find(p => p.kind === 'gate');
    return gate ? gate.url : pr.home;
  }
  const inGroup = gid => PROJECTS.filter(pr => pr.group === gid);

  const ALL = [];
  PROJECTS.forEach(pr => pr.pages.forEach(p => { p.project = pr; ALL.push(p); }));

  /* ── publish unlock: stored once here, handed to each page via the editor's
        existing #k= channel, so Publish never prompts again. ── */
  const PW_STORE = 'td-publish-pw';
  const getPw = () => { try { return localStorage.getItem(PW_STORE) || ''; } catch (e) { return ''; } };
  function buildEditUrls(){
    const pw = getPw();
    ALL.forEach(p => {
      // A card whose url already carries a query (?v=B pins the A/B variant) needs
      // '&', not a second '?' — otherwise edit=1 became part of the v value and
      // the editor simply never opened on that page.
      // editHost lets a card be VIEWED on its live host but EDITED on another copy
      // of the same files (same content store, so publishing still updates live).
      const base = p.editHost ? p.url.replace(/^https?:\/\/[^/]+/, p.editHost) : p.url;
      p.editUrl = base + (base.indexOf('?') === -1 ? '?' : '&') + 'edit=1&cc=' + encodeURIComponent(CC);
    });
  }
  // Publishing stays unlocked: the key is entered once here and handed to every
  // page through the editor's #k= channel, which stores it per-domain. After that
  // no page ever prompts again.
  function paintLock(){}

  /* ── stats ── */
  const STATS = 'https://jv-dashboard-chi.vercel.app/api/pagestats';
  let rangeDays = 7, statsByKey = {}, openProject = null, openGroup = null;
  let customFrom = null, customTo = null;

  /* A "reset" here HIDES history rather than deleting it: everything before the
     baseline date is excluded from every query. Nothing is destroyed, and the
     Undo button below puts it all back. */
  const BASE_KEY = 'td-stats-baseline';
  const getBaseline = () => { try { return localStorage.getItem(BASE_KEY) || ''; } catch (e) { return ''; } };
  const setBaseline = v => { try { v ? localStorage.setItem(BASE_KEY, v) : localStorage.removeItem(BASE_KEY); } catch (e) {} };

  const ymd = d => d.toISOString().slice(0,10);
  const rangeQS = () => {
    const base = getBaseline();
    let from = null, to = null;
    if (customFrom || customTo) { from = customFrom; to = customTo; }
    else if (rangeDays) {
      const t = new Date();
      to = ymd(t); from = ymd(new Date(t.getTime() - rangeDays * 864e5));
    }
    if (base && (!from || from < base)) from = base;   // never look further back than the reset
    let qs = '';
    if (from) qs += '&from=' + from;
    if (to)   qs += '&to=' + to;
    return qs;
  };
  const n = x => (x || 0).toLocaleString();
  const cvClass = v => v == null ? 'low' : v >= 25 ? 'good' : v >= 10 ? 'mid' : 'acc';
  const st = k => statsByKey[k] || { views:0, visitors:0, optins:0 };

  // roll a project's pages up; only gate pages count toward its conversion
  // every distinct tag this project can apply
  function projectTags(pr){
    var seen = {}, out = [];
    pr.pages.forEach(function(p){
      (p.tags || []).forEach(function(t){ if (!seen[t]) { seen[t] = 1; out.push(t); } });
    });
    return out;
  }

  function rollupGroup(g){
    let views=0, visitors=0, optins=0, gateVis=0;
    inGroup(g.id).forEach(pr => pr.pages.forEach(p => {
      const s = st(p.key);
      views += s.views; visitors += s.visitors;
      if (p.kind === 'gate') { optins += s.optins; gateVis += s.visitors; }
    }));
    return { views, visitors, optins, cv: gateVis ? (optins/gateVis)*100 : null };
  }

  function rollup(pr){
    let views=0, visitors=0, optins=0, gateVis=0;
    pr.pages.forEach(p => {
      const s = st(p.key);
      views += s.views; visitors += s.visitors;
      if (p.kind === 'gate') { optins += s.optins; gateVis += s.visitors; }
    });
    return { views, visitors, optins, cv: gateVis ? (optins/gateVis)*100 : null };
  }

  // GHL tags each page applies — click one to copy it for a contact search
  function tagBlock(tags){
    if (!tags) return '';
    if (!tags.length) return '<div class="taghead">GHL tags</div><div class="tag-none">no form on this page</div>';
    return '<div class="taghead">GHL tags</div><div class="tagrow">'
      + tags.map(function(t){ return '<span class="tag-chip" data-tag="' + t + '">' + t + '</span>'; }).join('')
      + '</div>';
  }

  function convBlock(cv, label){
    return '<div class="conv"><span class="big ' + cvClass(cv) + '">'
      + (cv == null ? '—' : cv.toFixed(1) + '%') + '</span><span class="lbl">' + label + '</span></div>';
  }

  function renderTotals(){
    let views=0, visitors=0, optins=0, gateVis=0;
    ALL.forEach(p => {
      const s = st(p.key);
      views += s.views; visitors += s.visitors;
      if (p.kind === 'gate') { optins += s.optins; gateVis += s.visitors; }
    });
    const cv = gateVis ? (optins/gateVis)*100 : null;
    document.getElementById('totals').innerHTML =
        '<div><div class="k">Views</div><div class="v">' + n(views) + '</div></div>'
      + '<div><div class="k">Unique visitors</div><div class="v">' + n(visitors) + '</div></div>'
      + '<div><div class="k">Opt-ins</div><div class="v">' + n(optins) + '</div></div>'
      + '<div><div class="k">Conversion</div><div class="v acc">'
        + (cv == null ? '—' : cv.toFixed(1) + '%') + '</div></div>';
  }

  function renderFolders(){
    document.getElementById('title').textContent = 'Your projects';
    document.getElementById('subtitle').textContent = 'Each funnel and its pages, with what they\u2019re converting at.';
    document.getElementById('crumbSlot').innerHTML = '';

    const groupCards = GROUPS.map(g => {
      const r = rollupGroup(g), kids = inGroup(g.id);
      return '<div class="card folder" data-group="' + g.id + '">'
        + '<div class="cardtop"><span class="tag">' + g.tag + '</span>'
          + '<span class="count">' + kids.length + ' magnets</span></div>'
        + '<div class="name"><span>' + g.icon + '</span>' + g.name + '</div>'
        + '<p class="desc">' + g.description + '</p>'
        + convBlock(r.cv, 'Conversion')
        + '<div class="micro"><span><b>' + n(r.views) + '</b> views</span>'
          + '<span><b>' + n(r.visitors) + '</b> visitors</span>'
          + '<span><b>' + n(r.optins) + '</b> opt-ins</span></div>'
        + '<div class="taghead">Inside</div><div class="tagrow">'
          + kids.map(k => '<span class="tag-chip" data-noc="1">' + k.icon + ' ' + k.name + '</span>').join('')
        + '</div>'
        + '<div class="actions">'
          + '<button type="button" class="btn" data-opengroup="' + g.id + '">Open \u2192</button>'
        + '</div></div>';
    }).join('');

    document.getElementById('grid').innerHTML = groupCards
      + PROJECTS.filter(pr => !pr.group).map(pr => projectCard(pr)).join('');

    document.querySelectorAll('.card.folder[data-group]').forEach(c => {
      c.addEventListener('click', e => { if (e.target.closest('a')) return; showGroup(c.dataset.group); });
    });
    document.querySelectorAll('.card.folder[data-project]').forEach(c => {
      c.addEventListener('click', e => { if (e.target.closest('a')) return; showProject(c.dataset.project); });
    });
  }

  function projectCard(pr){
    const r = rollup(pr);
    return '<div class="card folder" data-project="' + pr.id + '">'
      + '<div class="cardtop"><span class="tag">' + pr.tag + '</span>'
        + '<span class="count">' + pr.pages.length + (pr.pages.length > 1 ? ' pages' : ' page') + '</span></div>'
      + '<div class="name"><span>' + pr.icon + '</span>' + pr.name + '</div>'
      + '<p class="desc">' + pr.description + '</p>'
      + convBlock(r.cv, 'Conversion')
      + '<div class="micro"><span><b>' + n(r.views) + '</b> views</span>'
        + '<span><b>' + n(r.visitors) + '</b> visitors</span>'
        + '<span><b>' + n(r.optins) + '</b> opt-ins</span></div>'
      + tagBlock(projectTags(pr))
      + '<div class="actions">'
        + '<button type="button" class="btn" data-open="' + pr.id + '">Open \u2192</button>'
        + '<a class="btn ghost" href="' + entryUrl(pr) + '" target="_blank" rel="noopener">View live</a>'
        + '<button type="button" class="btn ghost copy" data-copy="' + entryUrl(pr) + '" title="Copy the opt-in link \u2014 the one you send people">Copy opt-in link \u29c9</button>'
      + '</div></div>';
  }

  // ---------- level 2: the magnets inside a group ----------
  function renderGroup(g){
    document.getElementById('title').textContent = g.icon + '  ' + g.name;
    document.getElementById('subtitle').textContent = g.description;
    document.getElementById('crumbSlot').innerHTML =
      '<div class="crumb"><button type="button" id="upBtn">\u2190 All projects</button>'
      + '<span class="where">Projects / <b>' + g.name + '</b></span></div>';
    document.getElementById('upBtn').addEventListener('click', showFolders);

    document.getElementById('grid').innerHTML = inGroup(g.id).map(pr => projectCard(pr)).join('');
    document.querySelectorAll('.card.folder[data-project]').forEach(c => {
      c.addEventListener('click', e => { if (e.target.closest('a')) return; showProject(c.dataset.project); });
    });
  }

  function renderProject(pr){
    document.getElementById('title').textContent = pr.icon + '  ' + pr.name;
    document.getElementById('subtitle').textContent = pr.description;
    const g = groupOf(pr);
    document.getElementById('crumbSlot').innerHTML =
      '<div class="crumb"><button type="button" id="upBtn">← ' + (g ? g.name : 'All projects') + '</button>'
      + '<span class="where">Projects / ' + (g ? g.name + ' / ' : '') + '<b>' + pr.name + '</b></span></div>';
    document.getElementById('upBtn').addEventListener('click', () => g ? showGroup(g.id) : showFolders());

    document.getElementById('grid').innerHTML = pr.pages.map((p, i) => {
      const s = st(p.key), isGate = p.kind === 'gate', isThanks = p.kind === 'thanks';
      const cv = isGate && s.visitors ? (s.optins/s.visitors)*100 : null;
      const kindLabel = isGate ? 'Opt-in page' : isThanks ? 'Thank-you page' : 'Asset page';
      return '<div class="card">'
        + '<div class="cardtop"><span class="tag">' + kindLabel + '</span></div>'
        + '<div class="name">' + p.name + '</div>'
        + '<p class="desc">' + p.description + '</p>'
        + convBlock(cv, isGate ? 'Conversion' : isThanks ? 'After the opt-in' : 'Behind an opt-in')
        + '<div class="micro"><span><b>' + n(s.views) + '</b> views</span>'
          + '<span><b>' + n(s.visitors) + '</b> visitors</span>'
          + (isGate ? '<span><b>' + n(s.optins) + '</b> opt-ins</span>' : '') + '</div>'
        + (isThanks && !(p.tags || []).length
             ? '<div class="taghead">GHL tags</div><div class="tag-none">tagged on the opt-in step: '
               + (projectTags(pr).join(', ') || 'none') + '</div>'
             : tagBlock(p.tags))
        + '<div class="actions">'
          + '<button type="button" class="btn" data-idx="' + i + '">Edit ↗</button>'
          + '<a class="btn ghost" href="' + p.url + '" target="_blank" rel="noopener">View live</a>'
          + '<button type="button" class="btn ghost copy" data-copy="' + p.url + '" title="Copy this page\u2019s own link">Copy link ⧉</button>'
          + (p.pdf ? '<a class="btn ghost" href="' + p.pdf + '" download>Download PDF ↓</a>' : '')
        + '</div></div>';
    }).join('');

    document.querySelectorAll('.card .btn[data-idx]').forEach(b => {
      b.addEventListener('click', () => openEditor(pr.pages[+b.dataset.idx]));
    });
  }

  function showFolders(){
    openProject = null; openGroup = null;
    if (location.hash && location.hash !== '#') history.pushState({}, '', '#');
    renderFolders();
  }
  function showGroup(id, skipHash){
    const g = GROUPS.find(x => x.id === id); if (!g) return;
    openGroup = g; openProject = null;
    if (!skipHash) history.pushState({group:id}, '', '#g/' + id);
    renderGroup(g);
  }
  function showProject(id, skipHash){
    const pr = PROJECTS.find(p => p.id === id); if (!pr) return;
    openProject = pr; openGroup = null;
    if (!skipHash) history.pushState({project:id}, '', '#p/' + id);
    renderProject(pr);
  }
  function repaint(){
    renderTotals();
    if (openProject) renderProject(openProject);
    else if (openGroup) renderGroup(openGroup);
    else renderFolders();
  }

  async function loadStats(){
    const rows = await Promise.all(ALL.map(async p => {
      try {
        const r = await fetch(STATS + '?p=' + encodeURIComponent(p.key) + rangeQS());
        const s = await r.json();
        return [p.key, { views:+s.views||0, visitors:+s.visitors||0, optins:+s.optins||0 }];
      } catch (e) { return [p.key, { views:0, visitors:0, optins:0 }]; }
    }));
    statsByKey = Object.fromEntries(rows);
    repaint();
  }

  const datesEl = document.getElementById('dates');

  document.getElementById('range').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'applyDates' || b.id === 'resetBtn' || b.id === 'meBtn') return;   // handled separately

    document.querySelectorAll('#range button').forEach(x => x.classList.toggle('on', x === b));

    if (b.dataset.custom) { datesEl.classList.add('on'); document.getElementById('dFrom').focus(); return; }

    datesEl.classList.remove('on');
    customFrom = customTo = null;
    rangeDays = +b.dataset.days;
    loadStats();
  });

  document.getElementById('applyDates').addEventListener('click', e => {
    e.stopPropagation();
    const f = document.getElementById('dFrom').value, t = document.getElementById('dTo').value;
    if (!f && !t) return;
    customFrom = f || null;
    customTo   = t || null;
    rangeDays  = 0;
    document.getElementById('customBtn').classList.add('on');
    loadStats();
  });

  const ME_KEY = 'td-notrack';
  const meOn = () => { try { return localStorage.getItem(ME_KEY) === '1'; } catch (e) { return false; } };
  function paintMe(){
    const b = document.getElementById('meBtn');
    b.classList.toggle('on', meOn());
    b.textContent = meOn() ? 'Ignoring me \u2713' : 'Ignore me';
  }
  document.getElementById('meBtn').addEventListener('click', e => {
    e.stopPropagation();
    try { meOn() ? localStorage.removeItem(ME_KEY) : localStorage.setItem(ME_KEY, '1'); } catch (err) {}
    paintMe();
  });

  document.getElementById('resetBtn').addEventListener('click', e => {
    e.stopPropagation();
    const today = ymd(new Date());
    if (!confirm('Ignore everything before ' + today + '?\n\nNothing is deleted \u2014 the dashboard just stops counting earlier traffic, including your own testing. You can undo this any time.')) return;
    setBaseline(today);
    paintBaseline();
  paintMe();
    loadStats();
  });

  function paintBaseline(){
    const el = document.getElementById('baseline'), b = getBaseline();
    el.classList.toggle('on', !!b);
    if (b) el.innerHTML = 'Counting from ' + b + ' <button id="undoBase" type="button">Undo</button>';
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('#undoBase')) return;
    setBaseline(''); paintBaseline(); loadStats();
  });

  /* ── editor overlay ── */
  const overlay = document.getElementById('overlay'), frame = document.getElementById('frame');
  const frameTitle = document.getElementById('frameTitle'), openTab = document.getElementById('openTab');

  function openEditor(p){
    frameTitle.innerHTML = p.project.name + ' · ' + p.name
      + ' <span class="sub">' + p.url.replace(/^https?:\/\//,'') + '</span>';
    openTab.href = p.editUrl;
    frame.src = p.editUrl;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeEditor(){
    overlay.classList.remove('open');
    frame.src = 'about:blank';
    document.body.style.overflow = '';
  }

  document.getElementById('dev').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#dev button').forEach(x => x.classList.toggle('on', x === b));
    const w = +b.dataset.w, stage = document.getElementById('stage');
    stage.classList.toggle('framed', w > 0);
    frame.style.width = w ? w + 'px' : '100%';
    frame.style.flexBasis = w ? w + 'px' : '';
  });

  document.getElementById('backBtn').addEventListener('click', closeEditor);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (overlay.classList.contains('open')) closeEditor();
    else if (openProject) { const g = groupOf(openProject); g ? showGroup(g.id) : showFolders(); }
    else if (openGroup) showFolders();
  });
  window.addEventListener('popstate', () => {
    if (overlay.classList.contains('open')) closeEditor();
    const p = location.hash.match(/^#p\/(.+)$/);
    const g = location.hash.match(/^#g\/(.+)$/);
    if (p) showProject(p[1], true);
    else if (g) showGroup(g[1], true);
    else { openProject = null; openGroup = null; renderFolders(); }
  });

  // copy a page URL straight to the clipboard — no need to open it first
  document.addEventListener('click', function(e){
    var b = e.target.closest('.btn.copy'); if (!b) return;
    e.preventDefault(); e.stopPropagation();
    var url = b.dataset.copy, old = b.textContent;
    var done = function(ok){
      b.textContent = ok ? 'Copied \u2713' : 'Press \u2318C';
      b.classList.add('copied');
      setTimeout(function(){ b.textContent = old; b.classList.remove('copied'); }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function(){ done(true); }, function(){ done(false); });
    } else {
      var ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta);
      ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (x) {}
      document.body.removeChild(ta); done(ok);
    }
  });

  // copy a tag with one click, ready to paste into a GHL contact search
  document.addEventListener('click', function(e){
    var chip = e.target.closest('.tag-chip'); if (!chip) return;
    if (chip.dataset.noc) return;                 // group card's "Inside" list
    var t = chip.dataset.tag;
    var done = function(){
      var old = chip.textContent;
      chip.textContent = 'copied ✓'; chip.classList.add('copied');
      setTimeout(function(){ chip.textContent = old; chip.classList.remove('copied'); }, 1100);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, done);
    else {
      var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
      ta.select(); try { document.execCommand('copy'); } catch (x) {}
      document.body.removeChild(ta); done();
    }
  });

  buildEditUrls();
  paintLock();
  paintBaseline();
  paintMe();
  const deepP = location.hash.match(/^#p\/(.+)$/);
  const deepG = location.hash.match(/^#g\/(.+)$/);
  if (deepP) showProject(deepP[1], true);
  else if (deepG) showGroup(deepG[1], true);
  else renderFolders();
  loadStats();
</script>

</body>
</html>
